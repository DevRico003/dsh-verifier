# dsh bundle patch: inserts the verifier into a profile's layer stack.
# Every value below is the composition BASE of the hot-reloadable `verifier:`
# section in $DSH_HOME/settings.yaml; override there, no restart needed.
- insert:
    - id: verifier
      name: dsh-verifier-gate
      config:
        enabled: true
        backend:
          # OpenAI-compatible chat completions WITH logprobs (the fine-grained score needs them).
          # Defaults target the DGX Spark pair serving DeepSeek-V4-Flash-0731.
          baseURL: http://YOUR_SPARK_HOST:8000/v1
          model: deepseek-v4-flash-0731
          apiKeyEnv: SPARK_API_KEY
          # One effort for every verifier call, gate and tools alike. `high` is the setting the
          # llm-as-a-verifier authors used for DeepSeek V4 Flash. Calls stream, so a long think never
          # trips a transport timeout; `idleTimeoutMs` catches a dead stream, `timeoutMs` is the cap.
          # `low` is about three times faster with verdicts within 0.06 on an A/B here; `none` is
          # the one-shot reading for chat sessions.
          reasoningEffort: high
          timeoutMs: 3600000
          # 15 min: a request queued behind a full server sends nothing until it is scheduled.
          idleTimeoutMs: 900000
          maxTokens: 65536
          temperature: 1.0
          topLogprobs: 20
          # 8 slots: an assessment is 3 calls, a select over three candidates 15; they fan out together.
          concurrency: 8
          retriesOnFallback: 1
          # Serial warm-up of the prompt prefix saves prefill work but doubles wall-clock;
          # on a local vLLM (prefill ~13k tok/s) the fan-out is the better trade.
          warmPrefix: false
        gate:
          enabled: true
          threshold: 0.6
          maxRounds: 1
          # Repeats per criterion (K), gate and verifier_assess alike. 1 = three calls per gate.
          evaluations: 1
          # auto: coding when the turn used tools, general otherwise. Or pin general | coding | terminal.
          criteria: auto
          skipWhenAskingUser: true
          # A turn opened only by a subagent report or plugin notice is gated only with real work in it.
          minToolCallsWithoutOwnTask: 8
          skipSubagents: true
          feedbackMaxChars: 2500
          timeoutMs: 4200000
        select:
          # One directed comparison per pair and criterion: three candidates are 5 pairs x 3 criteria,
          # 15 calls. Set 2 to cancel slot bias by swapping A/B, at twice the calls.
          evaluations: 1
          pivots: 1
          seed: 0
          criteria: general
        trajectory:
          maxStepChars: 6000
          # Over the cap the middle is elided; the opening and the most recent steps stay.
          maxTotalChars: 300000
          # A turn that opens with "Continue." gets this many earlier turns prepended.
          continuationTurns: 1
        snapshot:
          # `ui_snapshot`: headless screenshots (viewports x light/dark) for analyze_image.
          enabled: true
          channels: [chrome, chromium]
          headless: true
          viewports: ["1440x900", "390x844"]
          settleMs: 500
          navigationTimeoutMs: 30000
          dir: ""
        tools: true
        verbose: false
